name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, build, and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and release tooling
        run: python -m pip install --upgrade pip && python -m pip install -e . build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("moto-fitment-engine"))')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          fi

      - name: Verify changelog contains release
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[?${tag_version//./\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a release heading for $tag_version" >&2
            exit 1
          fi

      - name: Verify installed project
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify installed CLI
        run: |
          cd "$(mktemp -d)"
          moto-fitment --help | grep -F "Resolve verified motorcycle tyre fitment against a supplier CSV."

      - name: Verify documented quick start
        run: |
          output_file="$RUNNER_TEMP/pcx125-demo.json"
          moto-fitment Honda PCX125 2025 \
            --fitments data/verified_fitments.json \
            --catalog supplier_catalog.csv \
            --only-in-stock \
            --limit-per-axle 5 > "$output_file"
          python - "$output_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          assert payload["vehicle"]["make"] == "Honda"
          assert payload["vehicle"]["model"] == "PCX125"
          assert payload["oem"]["front_tyre_size"] == "110/70-14"
          assert payload["oem"]["rear_tyre_size"] == "130/70-13"
          assert payload["candidates"]["front"][0]["sku"] == "DEMO-PCX-FRONT-001"
          assert payload["candidates"]["rear"][0]["sku"] == "DEMO-PCX-REAR-001"
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
