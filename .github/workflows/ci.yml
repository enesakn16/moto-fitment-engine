name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Verify installed package outside source tree
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          python - <<'PY'
          import catalog_import
          import moto_alternatives
          import moto_catalog_ranking
          import moto_fitment
          import moto_fitment_service

          modules = (
              catalog_import,
              moto_fitment,
              moto_alternatives,
              moto_catalog_ranking,
              moto_fitment_service,
          )
          for module in modules:
              assert module.__file__, f"{module.__name__} has no import path"
              print(f"{module.__name__}: {module.__file__}")
          PY

      - name: Verify installed CLI entry point
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          moto-fitment --help | grep -F "Resolve verified motorcycle tyre fitment against a supplier CSV."

      - name: Validate verified fitment dataset
        run: |
          python - <<'PY'
          from moto_fitment import find_fitment, load_fitments_json

          records = load_fitments_json("data/verified_fitments.json")
          fitment = find_fitment(
              "Honda",
              "CB500F",
              2025,
              records,
              require_verified=True,
          )
          assert str(fitment.front) == "120/70-17"
          assert str(fitment.rear) == "160/60-17"
          assert fitment.is_verified
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
